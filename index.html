/* ---------- vykreslení ---------- */
let rendering=false;
function render(){
  const ae=document.activeElement;
  if(ae && ae!==document.body && $app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) ae.blur();
  if(rendering) return;
  rendering=true;
  try{ renderNow(); } finally{ rendering=false; }
}
function renderNow(){
  const pos={};
  if(!resetScroll) document.querySelectorAll("[data-scroll]").forEach(el=>{ pos[el.dataset.scroll]=el.scrollTop; });
  resetScroll=false;
  const p=dayPlan(selected);
  let cls="main", main;
  if(view==="home") main=homeCards(p)+bottomRow(p);
  else if(view==="settings"){ cls+=" settings"; main=settingsHtml(); }
  else if(view==="print"){ cls+=" settings"; main=printView(); }
  else { cls+=" single"; main=detailHtml(view,p)+bottomRow(p); }
  $app.innerHTML='<div class="app">'+headHtml(p)+sideHtml()+'<main class="'+cls+'">'+main+'</main>'+tabsHtml()+'</div>';
  if(view==="print"){ fitPreview(); requestAnimationFrame(fitPreview); }
  document.querySelectorAll("[data-scroll]").forEach(el=>{ if(pos[el.dataset.scroll]) el.scrollTop=pos[el.dataset.scroll]; });
  renderModal();
}

/* ---------- události ---------- */
document.addEventListener("click", async e=>{
  const t=e.target;
  const c=t.closest(".chk");
  if(c){
    const iso=c.dataset.iso, id=c.dataset.id, p=dayPlan(iso), penWas=countDone(iso,p.pencil)===p.pencil.length;
    toggle(iso,id); render();
    if(p.all.length && countDone(iso,p.all)===p.all.length) toast("Batoh je připravený! Skvělá práce!");
    else if(!penWas && p.pencil.length && countDone(iso,p.pencil)===p.pencil.length) toast("Penál je připravený!");
    return;
  }
  const day=t.closest("[data-day]"); if(day){ selected=day.dataset.day; if(day.dataset.go) view=day.dataset.go; resetScroll=true; render(); return; }
  const yd=t.closest("[data-yday]"); if(yd){ const d=yd.dataset.yday; if(isSchool(d)){ modalIso=d; renderModal(); } else toast(holidayOf(d)||"Víkend – volno"); return; }
  const pm=t.closest("[data-pmode]"); if(pm){ printMode=pm.dataset.pmode; render(); return; }
  const pw=t.closest("[data-pweek]"); if(pw){ printMon = pw.dataset.pweek==="next" ? defaultPrintMon() : addDays(printMon||defaultPrintMon(), +pw.dataset.pweek); render(); return; }
  if(t.closest("#btn-print")){ try{ window.print(); }catch(err){ toast("Tisk se nepodařilo otevřít."); } return; }
  if(t.closest("#btn-ics")){ downloadICS(); return; }
  const v=t.closest("[data-view]"); if(v){ if(v.dataset.pm) printMode=v.dataset.pm; view=v.dataset.view; resetScroll=true; window.scrollTo(0,0); render(); return; }
  if(t.closest("#btn-zitra") || t.closest('[data-modal="next"]')){ modalIso=nextSchoolDay(pragueToday()); renderModal(); return; }
  const md=t.closest("[data-mday]"); if(md){ modalIso=md.dataset.mday; renderModal(); return; }
  if(t.closest("[data-close]") || t.id==="zitra"){ if(modalIso && modalIso!==selected){ selected=modalIso; resetScroll=true; } modalIso=null; render(); return; }
  if(t.closest(".btn-clear")){
    if(await askConfirm("Odznačit všechny věci na "+DAY_ACC[dow(selected)]+" "+fmtShort(selected)+"?","Ano, odznačit")){ delete checks[selected]; saveChecks(); render(); toast("Odznačeno."); }
    return;
  }
  const at=t.closest("[data-addtask]"); if(at){ openTaskSheet(at.dataset.addtask||null); return; }
  const dt=t.closest("[data-deltask]"); if(dt){
    const tk=cfg.tasks.find(x=>x.id===dt.dataset.deltask);
    if(tk && await askConfirm("Smazat „"+tk.text+"“?","Smazat")){ cfg.tasks=cfg.tasks.filter(x=>x!==tk); saveCfg(); render(); toast("Smazáno."); }
    return;
  }
  const tab=t.closest("[data-tab]"); if(tab){ setTab=tab.dataset.tab; render(); return; }
  if(t.closest("#ov-new")){ cfg.overrides[editDate]={lessons:(cfg.schedule[dow(editDate)]||[]).slice(),note:""}; saveCfg(); render(); toast("Změna vytvořena – uprav hodiny."); return; }
  if(t.closest("#ov-del")){ delete cfg.overrides[editDate]; saveCfg(); render(); toast("Vrácen běžný rozvrh."); return; }
  const op=t.closest("[data-ovpick]"); if(op){ editDate=op.dataset.ovpick; render(); return; }
  const dh=t.closest("[data-delhol]"); if(dh){ cfg.holidays.splice(+dh.dataset.delhol,1); saveCfg(); resetSelected(); render(); return; }
  const mv=t.closest("[data-mv]"); if(mv){ const a=curSched(); if(!a) return; const i=+mv.dataset.i, j=i+(+mv.dataset.mv); if(j>=0&&j<a.length){ [a[i],a[j]]=[a[j],a[i]]; saveCfg(); render(); } return; }
  const dl=t.closest("[data-delles]"); if(dl){ const a=curSched(); if(a){ a.splice(+dl.dataset.delles,1); saveCfg(); render(); } return; }
  const dtm=t.closest("[data-deltime]"); if(dtm){ cfg.times.splice(+dtm.dataset.deltime,1); saveCfg(); render(); return; }
  const di=t.closest("[data-delitem]"); if(di){ cfg.subjects[+di.dataset.delitem].items.splice(+di.dataset.i,1); saveCfg(); render(); return; }
  const dli=t.closest("[data-dellist]"); if(dli){ cfg[dli.dataset.dellist].splice(+dli.dataset.i,1); saveCfg(); render(); return; }
  const ds=t.closest("[data-delsubj]"); if(ds){
    const s=cfg.subjects[+ds.dataset.delsubj];
    if(await askConfirm("Smazat předmět „"+s.name+"“? Zmizí i z rozvrhu.","Smazat")){
      cfg.subjects.splice(+ds.dataset.delsubj,1);
      Object.keys(cfg.schedule).forEach(d=>{ cfg.schedule[d]=cfg.schedule[d].filter(x=>x!==s.id); });
      saveCfg(); render();
    }
    return;
  }
  if(t.closest("#btn-testclear")){ testDate=null; testTime=null; drop(K_TEST); drop(K_TESTTIME); resetSelected(); render(); toast("Používá se skutečné datum a čas."); return; }
  if(t.closest("#btn-reset")){ if(await askConfirm("Obnovit výchozí rozvrh a pomůcky? Vaše úpravy se smažou.","Obnovit")){ const keep={tasks:cfg.tasks,overrides:cfg.overrides}; cfg=Object.assign(buildDefaults(),keep); saveCfg(); render(); toast("Výchozí nastavení obnoveno."); } return; }
});

document.addEventListener("submit", e=>{
  e.preventDefault();
  const f=e.target, inp=f.querySelector("input[type=text]"), val=inp?inp.value.trim():"";
  if(f.id==="task-form") return;
  if(f.id==="add-lesson"){ const a=curSched(); if(a){ a.push(f.querySelector("select").value); saveCfg(); render(); } return; }
  if(f.id==="add-hol"){
    const from=document.getElementById("add-hol-from").value, to=document.getElementById("add-hol-to").value||from;
    if(!from){ toast("Vyber datum."); return; }
    cfg.holidays.push({id:uid(), from, to:to<from?from:to, name:val||"Volno"}); sortHolidays(); saveCfg(); resetSelected(); render(); toast("Volno přidáno."); return;
  }
  if(!val) return;
  if(f.dataset.additem!==undefined) cfg.subjects[+f.dataset.additem].items.push({id:uid(),name:val});
  else if(f.dataset.addlist) cfg[f.dataset.addlist].push(Object.assign({id:uid(),name:val}, f.dataset.addlist==="daily"?{kind:"other"}:{}));
  else if(f.id==="add-subj") cfg.subjects.push({id:uid(),name:val,short:val.slice(0,3).toUpperCase(),color:"blue",icon:"book",pe:false,unverified:false,askParent:false,items:[]});
  else if(f.id==="add-time") cfg.times.push(val);
  saveCfg(); render(); toast("Přidáno.");
  const again=document.getElementById(inp.id); if(again) again.focus();
});

document.addEventListener("change", e=>{
  const t=e.target, d=t.dataset, val=(t.value||"").trim();
  if(t.closest && t.closest("#tasksheet")) return;
  if(d.les!==undefined){ const a=curSched(); if(a) a[+d.les]=t.value; }
  else if(t.id==="ov-date"){ if(t.value){ editDate=t.value; } render(); return; }
  else if(t.id==="child-name"){ cfg.child=val; }
  else if(t.id==="ov-note"){ const o=overrideOf(editDate); if(o) o.note=val; }
  else if(d.hfrom!==undefined){ if(t.value){ cfg.holidays[+d.hfrom].from=t.value; if(cfg.holidays[+d.hfrom].to<t.value) cfg.holidays[+d.hfrom].to=t.value; sortHolidays(); } resetSelected(); }
  else if(d.hto!==undefined){ if(t.value) cfg.holidays[+d.hto].to=t.value; resetSelected(); }
  else if(d.hname!==undefined){ cfg.holidays[+d.hname].name=val||"Volno"; }
  else if(d.time!==undefined) cfg.times[+d.time]=val;
  else if(d.sname!==undefined){ if(val) cfg.subjects[+d.sname].name=val; }
  else if(d.sshort!==undefined) cfg.subjects[+d.sshort].short=val;
  else if(d.scolor!==undefined) cfg.subjects[+d.scolor].color=t.value;
  else if(d.sicon!==undefined) cfg.subjects[+d.sicon].icon=t.value;
  else if(d.spe!==undefined) cfg.subjects[+d.spe].pe=t.checked;
  else if(d.sunv!==undefined) cfg.subjects[+d.sunv].unverified=t.checked;
  else if(d.sask!==undefined) cfg.subjects[+d.sask].askParent=t.checked;
  else if(d.sitem!==undefined){ if(val) cfg.subjects[+d.sitem].items[+d.i].name=val; }
  else if(d.list){ if(val) cfg[d.list][+d.i].name=val; }
  else if(t.id==="testtime"){ testTime=t.value||null; if(testTime) save(K_TESTTIME,testTime); else drop(K_TESTTIME); render(); toast(testTime?"Testovací čas nastaven.":"Používá se skutečný čas."); return; }
  else if(t.id==="testdate"){ testDate=t.value||null; if(testDate) save(K_TEST,testDate); else drop(K_TEST); resetSelected(); render(); toast(testDate?"Testovací datum nastaveno.":"Používá se skutečné datum."); return; }
  else return;
  saveCfg(); render();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && modalIso){ modalIso=null; render(); } });

/* nový den, když aplikace zůstane otevřená přes půlnoc */
let lastToday=pragueToday();
function checkNewDay(){ const t=pragueToday(); if(t!==lastToday){ lastToday=t; resetSelected(); pruneOld(); render(); } }
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkNewDay(); });
setInterval(checkNewDay, 60000);
let lastMin=nowMin();
setInterval(()=>{ const m=nowMin(); if(m===lastMin) return; lastMin=m;
  if(modalIso || document.querySelector(".overlay") || (view!=="home" && view!=="week")) return;
  render(); }, 15000);

window.__sp={dayPlan, nextSchoolDay, weekDates, pragueToday, timeline, nowMin, holidayOf, isSchool, get selected(){ return selected; }};
pruneOld();
pruneData();
render();
})();
</script>
