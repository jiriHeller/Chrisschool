<style>
/* Layout: aplikace na jednu obrazovku iPadu — horní lišta (logo · dny · hodiny · postup), boční navigace,
   mřížka karet (rozvrh · dnes potřebuji · moje pomůcky / penál · tělocvik · stav dne), řada „na zítra“.
   Technický styl: tenké linky, čárové ikony, štítky předmětů, čísla v neproporcionálním písmu. Světlý i tmavý režim. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --line:#E3E7ED; --line-2:#EEF1F4;
  --ink:#0E1626; --ink-2:#4A5568; --ink-3:#8C97A8;
  --accent:#2463EB; --accent-ink:#FFFFFF; --accent-soft:#E6EEFF; --accent-line:#BFD2FB;
  --ok:#14945A; --ok-soft:#E1F5EA; --warn:#B45309; --warn-soft:#FFF3E0;
  --pink-bg:#FDE8EE; --pink-fg:#B0164F; --pink-bd:#F6C9D7;
  --blue-bg:#E4EEFF; --blue-fg:#1C46C2; --blue-bd:#C3D6FA;
  --green-bg:#DEF4E6; --green-fg:#13723B; --green-bd:#B4E2C5;
  --yellow-bg:#FCF2CB; --yellow-fg:#8F5A06; --yellow-bd:#EED98A;
  --purple-bg:#EEE8FE; --purple-fg:#5F25C9; --purple-bd:#D5C9FA;
  --orange-bg:#FFEBDA; --orange-fg:#B33B0B; --orange-bd:#F8CFAE;
  --gray-bg:#EEF1F5; --gray-fg:#4A5568; --gray-bd:#CBD3DE;
  --shadow:0 1px 2px rgba(14,22,38,.05),0 2px 8px rgba(14,22,38,.04);
  --f-sans:"IBM Plex Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-game:'Titan One','Arial Rounded MT Bold',var(--f-sans);--f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:.85rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0E15; --surface:#111722; --surface-2:#161D2A; --line:#232C3B; --line-2:#1B2330;
  --ink:#E7ECF3; --ink-2:#A3AEBF; --ink-3:#6B778A;
  --accent:#4D8BFF; --accent-ink:#06101F; --accent-soft:#16264A; --accent-line:#28427A;
  --ok:#34C77B; --ok-soft:#10291C; --warn:#F2A54A; --warn-soft:#2E2111;
  --pink-bg:#36141F; --pink-fg:#F7A6C1; --pink-bd:#55203A;
  --blue-bg:#13213D; --blue-fg:#9ABDFF; --blue-bd:#1F3663;
  --green-bg:#0F2A1C; --green-fg:#8ADDAA; --green-bd:#1A4530;
  --yellow-bg:#2E260C; --yellow-fg:#F2CF6E; --yellow-bd:#4A3D13;
  --purple-bg:#221940; --purple-fg:#C6B4FF; --purple-bd:#382A63;
  --orange-bg:#35200F; --orange-fg:#FDBA8C; --orange-bd:#553219;
  --gray-bg:#1A2230; --gray-fg:#A9B4C5; --gray-bd:#2D384B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#111722; --surface-2:#161D2A; --line:#232C3B; --line-2:#1B2330;
  --ink:#E7ECF3; --ink-2:#A3AEBF; --ink-3:#6B778A;
  --accent:#4D8BFF; --accent-ink:#06101F; --accent-soft:#16264A; --accent-line:#28427A;
  --ok:#34C77B; --ok-soft:#10291C; --warn:#F2A54A; --warn-soft:#2E2111;
  --pink-bg:#36141F; --pink-fg:#F7A6C1; --pink-bd:#55203A;
  --blue-bg:#13213D; --blue-fg:#9ABDFF; --blue-bd:#1F3663;
  --green-bg:#0F2A1C; --green-fg:#8ADDAA; --green-bd:#1A4530;
  --yellow-bg:#2E260C; --yellow-fg:#F2CF6E; --yellow-bd:#4A3D13;
  --purple-bg:#221940; --purple-fg:#C6B4FF; --purple-bd:#382A63;
  --orange-bg:#35200F; --orange-fg:#FDBA8C; --orange-bd:#553219;
  --gray-bg:#1A2230; --gray-fg:#A9B4C5; --gray-bd:#2D384B;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{font-size:clamp(10px,min(1.105vw,1.473vh),18px)}
@supports (height:1dvh){html{font-size:clamp(10px,min(1.105vw,1.473dvh),18px)}}
@media (orientation:portrait){
  html{font-size:clamp(10px,min(1.473vw,1.105vh),18px)}
  @supports (height:1dvh){html{font-size:clamp(10px,min(1.473vw,1.105dvh),18px)}}
}
html,body,#app{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:1.1rem;line-height:1.3;overflow:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:none;background:none;padding:0;text-align:left}
input,select{-webkit-user-select:text;user-select:text;font-size:max(16px,1.1rem)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
svg{display:block}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.c-pink{--cbg:var(--pink-bg);--cfg:var(--pink-fg);--cbd:var(--pink-bd)}
.c-blue{--cbg:var(--blue-bg);--cfg:var(--blue-fg);--cbd:var(--blue-bd)}
.c-green{--cbg:var(--green-bg);--cfg:var(--green-fg);--cbd:var(--green-bd)}
.c-yellow{--cbg:var(--yellow-bg);--cfg:var(--yellow-fg);--cbd:var(--yellow-bd)}
.c-purple{--cbg:var(--purple-bg);--cfg:var(--purple-fg);--cbd:var(--purple-bd)}
.c-orange{--cbg:var(--orange-bg);--cfg:var(--orange-fg);--cbd:var(--orange-bd)}
.c-gray{--cbg:var(--gray-bg);--cfg:var(--gray-fg);--cbd:var(--gray-bd)}
.stag{display:inline-grid;place-items:center;min-width:2.6rem;height:1.6rem;padding:0 .4rem;border-radius:.4rem;background:var(--cbg);color:var(--cfg);
  border:1px solid var(--cbd);font-family:var(--f-mono);font-weight:600;font-size:.86rem;flex:none;letter-spacing:.02em}

.app{height:100%;display:grid;grid-template-columns:14rem minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "side main" "tabs tabs"}

/* ---------- horní lišta ---------- */
.head{grid-area:head;display:flex;align-items:center;gap:1.1rem;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:.65rem;flex:none;min-width:0}
.logo svg{width:2.7rem;height:2.7rem;flex:none}
.logo b{display:block;font-size:1.3rem;font-weight:700;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.logo span{display:block;font-size:.82rem;color:var(--ink-3);font-weight:500;white-space:nowrap}
.days{flex:1 1 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.25rem;background:var(--surface-2);border:1px solid var(--line);
  border-radius:.8rem;padding:.25rem;max-width:36rem;min-width:0}
.day{border-radius:.55rem;min-height:3.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:1.1rem;
  line-height:1.1;text-align:center;color:var(--ink-2);position:relative}
.day small{font-family:var(--f-mono);font-size:.8rem;font-weight:500;color:var(--ink-3)}
.day.is-today::after{content:"";position:absolute;top:.35rem;right:.45rem;width:.42rem;height:.42rem;border-radius:50%;background:var(--warn)}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.day[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.clockbox{flex:none;text-align:right;line-height:1.05}
.clockbox .clk{font-family:var(--f-mono);font-size:1.9rem;font-weight:600;letter-spacing:-.02em}
.clockbox .dt{display:block;font-size:.82rem;color:var(--ink-3);font-weight:500;white-space:nowrap}
.prog{flex:none;display:flex;align-items:center;gap:.55rem;padding:.3rem .8rem .3rem .4rem;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.prog svg{width:2.5rem;height:2.5rem;transform:rotate(-90deg)}
.prog b{display:block;font-family:var(--f-mono);font-size:1rem;font-weight:600;line-height:1.1}
.prog span{display:block;font-size:.8rem;color:var(--ink-2);font-weight:500;white-space:nowrap}
.ring-bg{stroke:var(--line)} .ring-fg{stroke:var(--accent);transition:stroke-dashoffset .3s}
.ring-fg.done{stroke:var(--ok)}
.head-tools{display:flex;gap:.4rem;flex:none}
.ibtn{width:3.3rem;height:3.3rem;border-radius:.7rem;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.ibtn svg{width:1.6rem;height:1.6rem}

/* ---------- navigace ---------- */
.side{grid-area:side;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.15rem;background:var(--surface);border-right:1px solid var(--line);
  padding-block:.8rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:.7rem}
.side .eyebrow{padding:.6rem .6rem .3rem}
.nav{display:flex;align-items:center;gap:.7rem;min-height:3.1rem;padding:.3rem .6rem;border-radius:.6rem;font-weight:500;font-size:1.08rem;color:var(--ink-2);width:100%;line-height:1.15}
.nav svg{width:1.5rem;height:1.5rem;flex:none}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .dotc{margin-left:auto;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
.side-foot .ver{display:block;margin-top:.35rem;opacity:.7}
.side-foot{margin-top:auto;padding:.7rem .6rem 0;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink-3);line-height:1.4}

/* ---------- mřížka karet ---------- */
.main{grid-area:main;min-height:0;min-width:0;display:grid;grid-template-columns:repeat(34,minmax(0,1fr));
  grid-template-rows:minmax(0,1.25fr) minmax(0,1fr) auto;gap:.75rem;
  padding-block:.8rem;padding-left:.8rem;padding-right:max(16px,env(safe-area-inset-right,0px))}
.c-roz{grid-column:1/15;grid-row:1}.c-dnes{grid-column:15/25;grid-row:1}.c-pom{grid-column:25/35;grid-row:1}
.c-pen{grid-column:1/13;grid-row:2}.c-pe{grid-column:13/24;grid-row:2}.c-map{grid-column:24/35;grid-row:2}
.c-cta{grid-column:1/15;grid-row:3}.c-prep{grid-column:15/28;grid-row:3}.c-stat{grid-column:28/35;grid-row:3}
.main.single{grid-template-rows:minmax(0,1fr) auto}
.main.single .c-cta,.main.single .c-prep,.main.single .c-stat{grid-row:2}
.c-detail{grid-column:1/35;grid-row:1}
.main.settings{grid-template-rows:minmax(0,1fr)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:.8rem .9rem;
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:.55rem;margin-bottom:.5rem;flex:none;min-width:0}
.card-h>svg{width:1.45rem;height:1.45rem;flex:none;color:var(--ink-3)}
.card-h h2{font-size:1.18rem;line-height:1.15;flex:1;min-width:0;letter-spacing:-.005em}
.count{font-family:var(--f-mono);font-weight:600;font-size:.92rem;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.count.full{color:var(--ok)}
.bar{height:.28rem;border-radius:999px;background:var(--line-2);overflow:hidden;flex:none;margin:-.15rem 0 .5rem}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar i.done{background:var(--ok)}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.empty{color:var(--ink-3);font-weight:500;padding:.5rem 0}

/* rozvrh */
.tl-text{display:flex;align-items:center;gap:.5rem;font-size:.98rem;line-height:1.2;margin-bottom:.55rem;color:var(--ink-2);flex:none;
  background:var(--surface-2);border:1px solid var(--line);border-radius:.55rem;padding:.4rem .6rem}
.tl-text b{color:var(--ink);font-weight:600}
.tl-dot{width:.55rem;height:.55rem;border-radius:50%;flex:none;background:var(--ink-3)}
.tl-text.lesson .tl-dot{background:var(--accent);animation:pulse 2s infinite}
.tl-text.break .tl-dot{background:var(--warn)}
.tl-text.before .tl-dot{background:var(--warn)}
.tl-text.after .tl-dot{background:var(--ok)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(36,99,235,.45)}70%{box-shadow:0 0 0 .45rem rgba(36,99,235,0)}100%{box-shadow:0 0 0 0 rgba(36,99,235,0)}}
.tt{display:grid;gap:.28rem;align-items:stretch}
.tt-h{text-align:center;font-family:var(--f-mono);font-weight:600;font-size:.9rem;line-height:1.05;color:var(--ink-2);padding-bottom:.15rem}
.tt-h small{display:block;font-size:.72rem;font-weight:500;color:var(--ink-3)}
.tt-d{font-weight:600;font-size:1rem;display:grid;place-items:center;border-radius:.45rem;min-height:max(30px,2.55rem);color:var(--ink-2);position:relative}
.tt-d.today::after{content:"";position:absolute;top:.25rem;right:.25rem;width:.38rem;height:.38rem;border-radius:50%;background:var(--warn)}
.tt-d.sel{background:var(--accent);color:var(--accent-ink)}
.tt-c{min-height:max(30px,2.55rem);border-radius:.45rem;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.98rem;letter-spacing:.02em;
  position:relative;overflow:hidden;background:var(--cbg);color:var(--cfg);border:1px solid var(--cbd)}
.tt-c.empty{background:transparent;border:1px dashed var(--line)}
.tt-c.unv{border:1.5px dashed var(--ink-3)}
.tt-c.sel{border-color:var(--cfg)}
.tt-c.past{opacity:.35}
.tt-c.next{outline:1.5px dashed var(--accent);outline-offset:2px}
.tt-c.now{outline:2px solid var(--accent);outline-offset:1px;z-index:1}
.tt-c.now::after{content:"";position:absolute;left:0;bottom:0;height:.22rem;width:var(--pct,0%);background:var(--accent)}
.tt-c span{position:relative;z-index:1}
.tt-legend{margin-top:.55rem;font-size:.84rem;color:var(--ink-3);line-height:1.5}
.tt-legend b{font-family:var(--f-mono);color:var(--ink-2);font-weight:600}
.wk-pill.now{outline:2px solid var(--accent);outline-offset:1px}

/* zaškrtávání */
.chk{display:flex;align-items:center;gap:.6rem;width:100%;min-height:max(32px,2.5rem);padding:.2rem .25rem;border-radius:.5rem;font-weight:500;font-size:1.04rem;line-height:1.2;color:var(--ink)}
.chk:active{background:var(--surface-2)}
.box{width:1.4rem;height:1.4rem;border-radius:.35rem;border:1.5px solid var(--ink-3);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:1rem;height:1rem;opacity:0;color:var(--accent-ink);transition:opacity .15s}
.chk[aria-checked="true"] .box,.box.on{background:var(--accent);border-color:var(--accent)}
.box.on.ok{background:var(--ok);border-color:var(--ok)}
.chk[aria-checked="true"] .box svg,.box.on svg{opacity:1}
.chk .lbl{flex:1;min-width:0;overflow-wrap:anywhere}
.chk[aria-checked="true"] .lbl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.chk .it{width:1.35rem;height:1.35rem;flex:none;color:var(--ink-3)}
.rows>.chk,.rows>.need{border-bottom:1px solid var(--line-2);border-radius:0}
.rows>.chk:last-child,.rows>.need:last-child{border-bottom:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:.8rem}
.grid2>.chk{border-bottom:1px solid var(--line-2);border-radius:0}

/* dnes potřebuji */
.c-dnes.dense .need,.c-dnes.dense .chk{min-height:max(28px,2.3rem);font-size:.98rem}
.c-dnes.xdense .need,.c-dnes.xdense .chk{min-height:max(26px,2.05rem);font-size:.94rem}
.need{display:flex;align-items:center;gap:.65rem;min-height:max(34px,2.85rem);width:100%;padding:.15rem .25rem;font-weight:500;font-size:1.06rem;line-height:1.15;color:var(--ink)}
.need .it{width:1.4rem;height:1.4rem;flex:none;color:var(--ink-2)}
.need .lbl{flex:1;min-width:0}
.need .go{font-family:var(--f-mono);font-weight:600;font-size:.88rem;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:.2rem;font-variant-numeric:tabular-nums}
.need .go svg{width:1.1rem;height:1.1rem}
.need .go.ok{color:var(--ok)}
.need[aria-checked="true"] .lbl{text-decoration:none;color:var(--ink)}
.pom .chk{gap:.55rem}

  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

/* iPad na výšku */
@media (orientation:portrait) and (min-width:700px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main" "tabs"}
  .side{display:none}
  .tabs{display:grid}
  .head{flex-wrap:wrap;row-gap:.55rem}
  .days{order:5;flex-basis:100%;max-width:none}
  .main{grid-template-rows:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .c-roz{grid-column:1/21;grid-row:1}.c-map{grid-column:21/35;grid-row:1}
  .c-dnes{grid-column:1/18;grid-row:2}.c-pom{grid-column:18/35;grid-row:2}
  .c-pen{grid-column:1/18;grid-row:3}.c-pe{grid-column:18/35;grid-row:3}
  .c-cta{grid-column:1/21;grid-row:4}.c-prep{grid-column:21/35;grid-row:4}.c-stat{display:none}
  .main.single .c-cta,.main.single .c-prep{grid-row:2}
}
/* telefon a malá okna */
@media (max-width:699px),(max-height:560px){
  html{font-size:15px}
  html,body,#app{height:auto}
  body{overflow:auto}
  .app{display:flex;flex-direction:column;min-height:100vh}
  .side,.prog{display:none}
  .head{flex-wrap:wrap;row-gap:.5rem}
  .days{order:5;flex-basis:100%;max-width:none}
  .main{display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px))}
  .card{overflow:visible}
  .body{overflow:visible}
  .tabs{display:grid;position:sticky;bottom:0;z-index:5}
}

<script>
(function(){

function buildDefaults(){
  const d = JSON.parse(JSON.stringify(DEFAULTS));
  d.subjects = d.subjects.map(s => ({pe:false, unverified:false, askParent:false, ...s, items: s.items.map((n,i) => ({id:s.id+"-"+i, name:n}))}));

  d.pe = d.pe.map((n,i)=>({id:"tv-"+i, name:n}));
  d.activities = d.activities.map(a=>Object.assign({},a,{items:(a.items||[]).map((n,i)=>({id:a.id+"-"+i, name:n}))}));
  d.holidays = d.holidays.map((h,i)=>({id:"hol-"+i, from:h[0], to:h[1], name:h[2]}));
  d.overrides = {};

}
function migrate(c){
  const d=buildDefaults();
  if(!Array.isArray(c.times)) c.times=d.times.slice();
  ["daily","pencil","pe"].forEach(k=>{ if(!Array.isArray(c[k])) c[k]=d[k]; });
  c.subjects.forEach(s=>{
    const ds=d.subjects.find(x=>x.id===s.id);
    if(!s.icon || !ICON_NAMES[s.icon]) s.icon = ds?ds.icon:"book";
    if(!s.color || !COLOR_HEX[s.color]) s.color = ds?ds.color:"blue";
    if(!Array.isArray(s.items)) s.items=[];
  });
  const kinds=["sdel","druz","food","drink"];
  c.daily.forEach(it=>{ if(!it.kind){ const m=/^den-(\d)$/.exec(it.id); it.kind=(m&&kinds[+m[1]])||"other"; } });
  if((c.version||0)<3){
    /* středa 4. hodina = Prvouka (upřesněno rodičem) */
    const w=c.schedule[3]||[];
    if(w[3]==="x4") w[3]="pu";
    if(!Object.values(c.schedule).some(d=>(d||[]).includes("x4"))) c.subjects=c.subjects.filter(x=>x.id!=="x4");
  }
  if(!Array.isArray(c.holidays)) c.holidays=d.holidays;
  if(!c.overrides || typeof c.overrides!=="object") c.overrides={};
  if(!Array.isArray(c.tasks)) c.tasks=[];
  (c.pencil||[]).forEach(it=>{ if(/^IQ karta$/i.test((it.name||"").trim())) it.name="ISIC karta"; });
  if((c.version||0)<6){
    const cj=c.subjects.find(x=>x.id==="cj");
    if(cj && !cj.items.some(it=>/pracovní sešit/i.test(it.name||""))) cj.items.push({id:"cj-6", name:"Pracovní sešit češtiny"});
  }
  if(c.child===undefined) c.child="Chris";
  if((c.version||0)<8){ (c.holidays||[]).forEach(h=>{ if(h.from==="2027-02-22"&&h.to==="2027-02-28"){ h.from="2027-03-01"; h.to="2027-03-07"; } }); }
  if(!Array.isArray(c.activities)) c.activities=d.activities;
  if(!Array.isArray(c.routine)) c.routine=d.routine;
  (c.routine||[]).forEach(r=>{ if(r.id==="vec" && r.movable===undefined) r.movable=true; });
  if((c.version||0)<10){
    (c.daily||[]).forEach(it=>{
      if(it.kind==="sdel" && /sdělov/i.test(it.name||"")) it.name="Žákovská knížka";
      if(it.kind==="druz" && /družin/i.test(it.name||"")) it.name="Notýsek z družiny";
    });
    if(!(c.daily||[]).some(it=>/žákovsk/i.test(it.name||""))) c.daily.unshift({id:"den-zk", name:"Žákovská knížka", kind:"sdel"});
    const cj=c.subjects.find(x=>x.id==="cj");
    if(cj){ cj.items.forEach(it=>{ if(/^Sešit češtiny V$/i.test((it.name||"").trim())) it.name="Sešit češtiny B"; });
      if(!cj.items.some(it=>/^Sešit češtiny B$/i.test(it.name||""))) cj.items.push({id:"cj-b", name:"Sešit češtiny B"});
      const re=/^Sešit češtiny [A-Z]$/i, idx=[], ss=[]; cj.items.forEach((it,i)=>{ if(re.test((it.name||"").trim())){ idx.push(i); ss.push(it); } });
      ss.sort((x,y)=>x.name.localeCompare(y.name)); idx.forEach((i,k)=>{ cj.items[i]=ss[k]; }); }
    if(!c.pencil.some(it=>/tužk/i.test(it.name||""))) c.pencil.push({id:"pen-7", name:"Tužka"});
    if(!c.pencil.some(it=>/ořez/i.test(it.name||""))) c.pencil.push({id:"pen-8", name:"Ořezávátko"});
  }

    const df=d.activities.find(a=>a.id==="flo"), cf=(c.activities||[]).find(a=>a.id==="flo");
    if(cf && !(cf.items&&cf.items.length)) cf.items=df.items;
  }
  (c.activities||[]).forEach(a=>{ if(!Array.isArray(a.items)) a.items=[]; });
  if((c.version||0)<12 && !(c.daily||[]).some(it=>/úkolníč/i.test(it.name||""))){
    const i=c.daily.findIndex(it=>it.kind==="sdel");
    c.daily.splice(i>=0?i+1:0,0,{id:"den-uk", name:"Úkolníček", kind:"ukol"});
  }
  if((c.version||0)<13 && !(c.holidays||[]).some(h=>h.from==="2026-11-16")){
    const src=d.holidays.find(h=>h.from==="2026-11-16"); if(src) c.holidays.push(Object.assign({},src,{id:"hol-rv-20261116"}));
    c.holidays.sort((a,b)=>a.from<b.from?-1:1);
  }
  c.version=13;
  return c;
}

/* ---------- úložiště ---------- */
const K_CFG="skolni-partak.cfg.v1", K_CHK="skolni-partak.checks.v1", K_TEST="skolni-partak.testdate", K_TESTTIME="skolni-partak.testtime";
function load(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function drop(k){ try{ localStorage.removeItem(k); }catch(e){} }

let cfg = load(K_CFG);
if(!cfg || !cfg.subjects || !cfg.schedule) cfg = buildDefaults(); else cfg = migrate(cfg);
save(K_CFG,cfg);
let checks = load(K_CHK) || {};
let testDate = load(K_TEST) || null;
let testTime = load(K_TESTTIME) || null;
function saveCfg(){ save(K_CFG,cfg); }
function saveChecks(){ save(K_CHK,checks); }

/* ---------- datum (místní čas ČR) ---------- */
const DAY_NAMES=["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
const DAY_SHORT=["Ne","Po","Út","St","Čt","Pá","So"];
const DAY_ACC=["neděli","pondělí","úterý","středu","čtvrtek","pátek","sobotu"];
const MONTHS=["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
function pragueToday(){
  if(testDate) return testDate;
  try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Prague",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
  catch(e){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
}
function toD(iso){ return new Date(iso+"T12:00:00Z"); }
function toIso(d){ return d.toISOString().slice(0,10); }
function dow(iso){ return toD(iso).getUTCDay(); }
function addDays(iso,n){ const d=toD(iso); d.setUTCDate(d.getUTCDate()+n); return toIso(d); }
function holidayOf(iso){ const h=(cfg.holidays||[]).find(x=>x.from&&x.to&&iso>=x.from&&iso<=x.to); return h?(h.name||"Volno"):null; }
function isSchool(iso){ const w=dow(iso); return w>=1 && w<=5 && !holidayOf(iso); }
function lessonIds(iso){ if(holidayOf(iso)||offsiteOf(iso)) return []; const o=cfg.overrides&&cfg.overrides[iso]; return o&&Array.isArray(o.lessons)?o.lessons:(cfg.schedule[dow(iso)]||[]); }
function overrideOf(iso){ return cfg.overrides&&cfg.overrides[iso]||null; }
const TASK_KIND={ukol:{label:"Úkol",icon:"i-pencil"},prinest:{label:"Přinést",icon:"i-bag"},akce:{label:"Akce",icon:"i-flag"}};
/* sdílené akce z events.json (zapisuje rodič / Claude, načítá se z webu) */
const K_EV="skolni-partak.events.v1";
let SHARED=(function(){ try{ const v=JSON.parse(localStorage.getItem(K_EV)||"null"); return Array.isArray(v)?v:[]; }catch(e){ return []; } })();
function sharedFor(iso){ return SHARED.filter(e=>e&&e.date===iso).map(e=>({id:"ev-"+e.id, name:e.title, from:e.from||"", to:e.to||"", place:e.place||"", note:e.note||"", pe:!!e.pe, shared:true,
  items:(e.items||[]).map((n,i)=>({id:"ev-"+e.id+"-"+i, name:n}))})); }
function loadShared(){
  if(!/^https?:/.test(location.protocol)) return;
  fetch("events.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(v=>{
    const list=v&&Array.isArray(v.events)?v.events:null; if(!list) return;
    if(JSON.stringify(list)===JSON.stringify(SHARED)) return;
    SHARED=list; try{ localStorage.setItem(K_EV,JSON.stringify(list)); }catch(e){}
    render();
  }).catch(()=>{});
}
function offsiteOf(iso){ const e=SHARED.find(x=>x&&x.date===iso&&x.offsite); return e&&!holidayOf(iso)?e:null; }
function offLabel(e,short){ return (e.title||"Akce mimo školu")+(e.from?(short?" ":" · ")+e.from+(e.to?"–"+e.to:""):""); }
function tasksFor(iso){ return (cfg.tasks||[]).filter(t=>t.date===iso).map(t=>({id:"t-"+t.id, tid:t.id, name:t.text, kind:t.kind, subj:t.subj})); }
function nextSchoolDay(iso){ let d=addDays(iso,1); while(!isSchool(d)) d=addDays(d,1); return d; }
function weekMonday(iso){ const w=dow(iso); if(w===0) return addDays(iso,1); if(w===6) return addDays(iso,2); return addDays(iso,1-w); }
function weekDates(iso){ const m=weekMonday(iso); return [0,1,2,3,4].map(i=>addDays(m,i)); }
function fmtLong(iso){ const d=toD(iso); return DAY_NAMES[d.getUTCDay()]+" "+d.getUTCDate()+". "+MONTHS[d.getUTCMonth()]; }
function fmtShort(iso){ const d=toD(iso); return d.getUTCDate()+". "+(d.getUTCMonth()+1)+"."; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function prepDay(wd){ return (wd===3||wd===4?"ve ":"v ")+DAY_ACC[wd]; }
function dayWord(iso){ const t=pragueToday(); if(iso===t) return "dnes"; if(iso===addDays(t,1)) return "zítra"; return prepDay(dow(iso)); }
function nowMin(){
  if(testTime){ const m=/^(\d{1,2}):(\d{2})/.exec(testTime); if(m) return (+m[1])*60+(+m[2]); }
  try{ const pr=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Prague",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
       return (+pr.find(x=>x.type==="hour").value)*60+(+pr.find(x=>x.type==="minute").value); }
  catch(e){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
}
function parseRange(t){ const m=/(\d{1,2})[:.](\d{2})\D+(\d{1,2})[:.](\d{2})/.exec(t||""); return m?[(+m[1])*60+(+m[2]),(+m[3])*60+(+m[4])]:null; }
function fmtMin(x){ return Math.floor(x/60)+":"+String(x%60).padStart(2,"0"); }
function dur(m){ return m<60 ? m+" min" : Math.floor(m/60)+" h"+(m%60?" "+(m%60)+" min":""); }
function things(n){ return n===1?"věc":(n>=2&&n<=4?"věci":"věcí"); }

/* ---------- logika ---------- */
function subj(id){ return cfg.subjects.find(s=>s.id===id); }
function dayPlan(iso){
  const wd=dow(iso);
  const holiday=holidayOf(iso), ov=holiday?null:overrideOf(iso), tasks=tasksFor(iso);
  const lessons=lessonIds(iso).map(id=>subj(id)||{id, name:"Neznámý předmět", short:"?", items:[], unverified:true, color:"gray", icon:"q"});
  const seen=new Set(), uniq=[];
  lessons.forEach(s=>{ if(!seen.has(s.id)){ seen.add(s.id); uniq.push(s); } });
  const shared=holiday?[]:sharedFor(iso), evPE=shared.filter(e=>e.pe);
  const peSubjects=uniq.filter(s=>s.pe).concat(evPE.map(e=>({name:e.name}))), hasPE=peSubjects.length>0;

function timeline(p){
  const slots=p.lessons.map((s,i)=>{ const r=parseRange(cfg.times[i]); return r&&r[1]>r[0]?{i,s,a:r[0],b:r[1]}:null; }).filter(Boolean);
  for(let k=1;k<slots.length;k++){ if(slots[k].a<slots[k-1].b) return null; }
  if(!slots.length) return null;
  const isToday=p.iso===pragueToday(), now=nowMin(), start=slots[0].a, end=slots[slots.length-1].b;
  let phase="other", html, curI=-1, nextI=-1, pct=0;
  if(!isToday) html='Vyučování <b>'+fmtMin(start)+' – '+fmtMin(end)+'</b>';
  else if(now<start){ phase="before"; nextI=slots[0].i; html='Vyučování začíná v <b>'+fmtMin(start)+'</b> (za '+dur(start-now)+')'; }
  else if(now>=end){ phase="after"; html='Vyučování skončilo v '+fmtMin(end)+'. <b>Hurá domů!</b>'; }
  else {
    const L=slots.find(x=>now>=x.a&&now<x.b);
    if(L){ phase="lesson"; curI=L.i; pct=Math.round((now-L.a)/(L.b-L.a)*100); html='Teď: <b>'+(L.i+1)+'. hodina – '+esc(L.s.name)+'</b> · zbývá '+dur(L.b-now); }
    else { const N=slots.find(x=>x.a>now); phase="break"; nextI=N.i; html='<b>Přestávka</b> · za '+dur(N.a-now)+' začíná '+(N.i+1)+'. hodina ('+esc(N.s.name)+')'; }

  return {slots,isToday,now,start,end,phase,html,curI,nextI,pct};
}

function idb(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej("no idb"); const r=indexedDB.open("skolni-partak",1); r.onupgradeneeded=()=>r.result.createObjectStore("photos"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

function reminders(p){
  const out=[], w=cap(dayWord(p.iso));
  if(p.holiday) return w+" je volno – "+p.holiday+"."+(dailyPending()?" Dnes ještě Test dne ve Výuce.":"");
  { const hw=homeworkOpen().filter(x=>x.date<=addDays(pragueToday(),1)); if(hw.length) out.push("Domácí úkol"+(hw.length>1?"y":"")+": "+hw.map(x=>x.text).join(", ")+" – ještě není hotov"+(hw.length>1?"é":"ý")+"."); }
  if(dailyPending()) out.push("Dnes ještě: Test dne ve Výuce (10 otázek).");
  if(PET.name&&!petAsleepAt(Date.now())){ petTick(); if(petNeeds()) out.push(petMsg()); }
  if(p.ov) out.push("Změna rozvrhu"+(p.ov.note?": "+p.ov.note:"")+".");
  (p.acts||[]).filter(a=>a.shared).forEach(a=>out.push(a.name+(a.from?" – "+a.from:"")+(a.note?" ("+a.note+")":"")+"."));
  if(p.tasks.length) out.push("Nezapomeň: "+p.tasks.map(t=>t.name).join(", ")+".");
  if(p.hasPE) out.push(w+" je tělocvik – vezmi si úbor a boty.");
  else { const n=nextPE(p.iso); if(n) out.push("Tělocvik bude "+dayWord(n)+" ("+fmtShort(n)+")."); }
  const unv=p.lessons.map((s,i)=>s.unverified?(i+1)+".":null).filter(Boolean);
  if(unv.length) out.push(unv.join(" a ")+" hodina není ověřená – zeptej se rodičů.");
  p.groups.filter(g=>!g.items.length && !g.unverified).forEach(g=>out.push(g.title+": pomůcky doplní rodič."));
  { const G=PET.name&&goal(); if(G&&!G.won&&!(G.until&&G.until<pragueToday())&&out.length<2){ const tgt=G.type==="lesson"?100:G.type==="custom"?1:G.target; out.push("🎯 Cíl: "+goalText(G)+(G.type==="custom"?"":" ("+Math.min(goalCur(G),tgt)+" / "+tgt+")")+"."); } }

  return out.slice(0,2).join(" ");
}

const DARK_FROM=[16.5,17.3,18.2,19.8,20.6,21.2,21.1,20.4,19.4,18.4,16.9,16.2], LIGHT_FROM=[7.8,7.3,6.5,6.4,5.4,4.9,5.1,5.7,6.4,7.1,7.0,7.7];
function isDarkAt(ts){ const t=pragueHM(ts)/60, mo=Number(new Intl.DateTimeFormat("en-GB",{month:"numeric",timeZone:"Europe/Prague"}).format(new Date(ts)))-1; return t>=DARK_FROM[mo]||t<LIGHT_FROM[mo]; }
// šlofíky: zhruba každé 2 hodiny na 15 minut (morčata spí krátce, ve dne i v noci)
const NAP_LEN=15;
function napInfo(ts){ const t=pragueHM(ts), day=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Prague"}).format(new Date(ts)), b=Math.floor(t/120);
  let h=7; for(const c of day+"#"+b) h=(h*131+c.charCodeAt(0))%100003; const off=b*120+15+(h%(120-NAP_LEN-30));
  return t>=off&&t<off+NAP_LEN?{asleep:true,wakeIn:off+NAP_LEN-t}:{asleep:false}; }
function petAsleepAt(ts){ return napInfo(ts).asleep; }
function petTick(){
  const now=Date.now(); let t=PET.last||now; if(now<=t){ PET.last=now; return; }
  const step=15*60*1000, R={food:4,water:5,joy:3};
  while(t<now){ const dt=Math.min(step,now-t), f=(petCalmAt(t)?0.5:1)*dt/3600000;
    for(const k in R) PET.stats[k]=Math.max(0,PET.stats[k]-R[k]*f); t+=dt; }
  PET.last=now; savePet();
}
function petLevel(){ let l=1; PET_LEVELS.forEach((x,i)=>{ if(PET.xp>=x) l=i+1; }); return Math.min(l,PET_LEVELS.length); }
function petMood(){ const s=PET.stats, low=Math.min(s.food,s.water,s.joy), avg=(s.food+s.water+s.joy)/3;
  if(petAsleepAt(Date.now())) return "sleep"; if(low<20) return "sad"; if(avg>=70) return "happy"; return "ok"; }
function petNeeds(){ const s=PET.stats; return s.food<30||s.water<30||s.joy<25; }
function petEarn(k,n){ PET.inv[k]=(PET.inv[k]||0)+n; savePet(); if(quiz){ quiz.earn=quiz.earn||{}; quiz.earn[k]=(quiz.earn[k]||0)+n; } }
function petMsg(){
  const s=PET.stats, n=PET.name||"Morče", m=petMood();
  if(isDarkAt(Date.now())&&m!=="sad"&&m!=="sleep") return n+" je i v noci čilý – morčata v noci rádi chroupou seno a hrají si.";
  if(m==="sleep"){ const w=napInfo(Date.now()).wakeIn||1; return n+" si dává šlofíka. Zzz… Probudí se asi za "+w+" min."+(s.food<30||s.water<30?" Má hlad nebo žízeň – můžeš mu potichu dát jídlo a vodu.":""); }
  if(s.water<30) return n+" má žízeň. Dej mu vodu!";
  if(s.food<30) return n+" má hlad. Dej mu seno nebo mrkev.";
  if(s.joy<25) return n+" se nudí. Pohlaď ho nebo mu dej jahodu.";
  if(m==="happy") return n+" je spokojené a radostí poskakuje!";
  return n+" je v pohodě. Za cvičení ve Výuce získáš další dobroty.";
}

function aclockSvg(cls,big){
  const ticks=[...Array(60)].map((_,i)=>{const a=i*6*Math.PI/180, r1=i%5?44:40; return '<line x1="'+(50+r1*Math.sin(a)).toFixed(1)+'" y1="'+(50-r1*Math.cos(a)).toFixed(1)+'" x2="'+(50+47*Math.sin(a)).toFixed(1)+'" y2="'+(50-47*Math.cos(a)).toFixed(1)+'" stroke="#2D1B3D" stroke-width="'+(i%5?1:2.6)+'"/>';}).join("");
  const nums=[...Array(12)].map((_,i)=>{const n=i+1,a=n*30*Math.PI/180; return '<text x="'+(50+32*Math.sin(a)).toFixed(1)+'" y="'+(50-32*Math.cos(a)+4.6).toFixed(1)+'" text-anchor="middle" font-size="'+(n%3?10:13)+'" font-family="Titan One,Arial Rounded MT Bold,sans-serif" fill="'+(n%3?"#5B4A7A":"#2D1B3D")+'">'+n+'</text>';}).join("");
  return '<svg viewBox="0 0 100 100" class="aclock '+(cls||"")+'" aria-hidden="true"><circle cx="50" cy="50" r="49" fill="#FFE14D" stroke="#2D1B3D" stroke-width="2"/><circle cx="50" cy="50" r="45" fill="#fff"/>'+ticks+nums+
    '<g class="hh"><line x1="50" y1="56" x2="50" y2="27" stroke="#2D1B3D" stroke-width="6" stroke-linecap="round"/></g>'+
    '<g class="mh"><line x1="50" y1="58" x2="50" y2="12" stroke="#3B5BDB" stroke-width="4" stroke-linecap="round"/></g>'+

    '<circle cx="50" cy="50" r="4" fill="#2D1B3D"/></svg>';
}
let clockPeek=0;
function digitalShown(){ const m=nowMin()%60; return Date.now()<clockPeek || m%15<2; }
function tickClocks(){
  const t=nowMin(), h=Math.floor(t/60)%12, m=t%60, s=new Date().getSeconds();
  document.querySelectorAll(".aclock").forEach(el=>{
    const hh=el.querySelector(".hh"), mh=el.querySelector(".mh"), sh=el.querySelector(".sh");
    if(hh) hh.setAttribute("transform","rotate("+((h+m/60)*30)+" 50 50)");
    if(mh) mh.setAttribute("transform","rotate("+((m+s/60)*6)+" 50 50)");
    if(sh) sh.setAttribute("transform","rotate("+(s*6)+" 50 50)");
  });
  const cb=document.querySelector(".clockbox"); if(cb){ const on=digitalShown(); cb.classList.toggle("dig",on); const k=cb.querySelector(".clk"); if(k&&k.textContent!==fmtMin(t)) k.textContent=fmtMin(t); }
}
setInterval(tickClocks,1000);

const GOAL_TYPES={
  tests:{n:"Udělat testy",unit:"testů",def:5,cur:G=>(progInit().cnt.tests||0)-(G.base||0)},
  daily:{n:"Test dne",unit:"× Test dne",def:5,cur:G=>(progInit().cnt.daily||0)-(G.base||0)},
  streak:{n:"Série dní",unit:"dní v řadě",def:5,cur:()=>streakInfo().n},

  answers:{n:"Správné odpovědi",unit:"správných odpovědí",def:100,cur:G=>(progInit().cnt.answers||0)-(G.base||0)},
  coins:{n:"Našetřit mince",unit:"mincí",def:100,cur:()=>PET.coins||0},
  lesson:{n:"Téma na 100 %",unit:"%",def:100,cur:G=>((LEARN[G.lesson]||{}).best||0)},

function goal(){ const P=progInit(); return P.goal||null; }
function goalCur(G){ const t=GOAL_TYPES[G.type]; return Math.max(0,t.cur(G)); }
function goalText(G){ const t=GOAL_TYPES[G.type];
  if(G.type==="custom") return G.text; if(G.type==="lesson"){ const l=lessonById(G.lesson); return "Mít "+(l?"„"+l.title+"“":"téma")+" na 100 %"; }
  if(G.type==="coins") return "Našetřit "+G.target+" mincí"+(G.item&&SHOP_BY[G.item]?" na „"+SHOP_BY[G.item].name+"“":"");
  if(G.type==="streak") return "Série "+G.target+" dní v řadě"; if(G.type==="sprint") return "Ve sprintu dát "+G.target+" příkladů";
  return G.target+" "+t.unit.replace(/^×\s*/,"× "); }
function goalCheck(){
  const G=goal(); if(!G||G.won||(G.until&&G.until<pragueToday())) return; const cur=goalCur(G), tgt=G.type==="lesson"?100:G.type==="custom"?1:G.target;
  if(cur>=tgt){ G.won=pragueToday(); PET.gold=(PET.gold||0)+2; PET.coins=(PET.coins||0)+30; const P=progInit(); P.goals=(P.goals||[]).concat([{t:goalText(G),d:G.won,rew:G.reward||""}]).slice(-20); savePet(); setTimeout(()=>goalWin(G),500); }
}
function goalWin(G){
  const ov=document.createElement("div"); ov.className="overlay chest-ov";
  ov.innerHTML='<div class="sheet chest-sh goalwin"><div class="pk-confetti">'+[...Array(22)].map((_,i)=>'<i style="left:'+(i*4.6)+'%;animation-delay:'+(i%6)*.1+'s;background:'+["#FFE14D","#FF4F8B","#40C4FF","#7CFF9B"][i%4]+'"></i>').join("")+'</div><div class="gw-ic">🏆</div><h2>Cíl splněn!</h2><p class="gw-t">'+esc(goalText(G))+'</p>'+
    '<div class="chest-rw"><span>'+coinSvg(false)+'<b>+30</b></span><span>'+coinSvg(true)+'<b>+2</b></span></div>'+(G.reward?'<p class="gw-rew">A od rodičů: <b>'+esc(G.reward)+'</b> 🎁</p>':"")+'<button type="button" class="btn primary big" data-chclose>Hurá!</button></div>';

  feed:{t:"Nakrm morče 3×",need:3,g:"pet"},pet:{t:"Pohlaď morče",need:1,g:"pet"},dance:{t:"Zatancuj s morčetem 2×",need:2,g:"pet"},
  pack:{t:"Sbal batoh krok za krokem",need:1,g:"school"},hw:{t:"Dodělej domácí úkol",need:1,g:"school"}};
function questsFor(d){
  let h=0; for(const c of "q"+d) h=(h*33+c.charCodeAt(0))>>>0;
  const L=["daily","answers","tests","sprint"], Pt=["feed","pet","dance"], third=[];
  if(isSchool(nextSchoolDay(addDays(d,-1)))&&nextSchoolDay(d)===addDays(d,1)) third.push("pack");
  if(homeworkOpen().length) third.push("hw");
  const a=L[h%4], b=Pt[(h>>>3)%3], restL=L.filter(x=>x!==a); third.push(restL[(h>>>6)%3]);
  return [a,b,third[(h>>>9)%third.length]];
}
function questProg(d,id){ const q=(PET.prog&&PET.prog.q[d])||{}; return q[id]||0; }
function questsDone(d){ return questsFor(d).every(id=>questProg(d,id)>=QUESTS[id].need); }
function prog(ev,n){
  if(!PET||!PET.name) return; const P=progInit(), d=pragueToday(); n=n==null?1:n;
  const q=P.q[d]=P.q[d]||{}; Object.keys(P.q).filter(x=>x<addDays(d,-14)).forEach(x=>delete P.q[x]);
  if(QUESTS[ev]&&QUESTS[ev].max) q[ev]=Math.max(q[ev]||0,n); else q[ev]=(q[ev]||0)+n;
  if(ev==="sprint") P.cnt.sprintBest=Math.max(P.cnt.sprintBest||0,n); else P.cnt[ev]=(P.cnt[ev]||0)+n;
  if(["tests","daily","pack","hw"].includes(ev)) P.days[d]=true;
  Object.keys(P.days).filter(x=>x<addDays(d,-120)).forEach(x=>delete P.days[x]);
  const wasReady=P.chest[d]; if(!wasReady&&questsDone(d)){ P.chest[d]="ready"; setTimeout(()=>toast("Splnil jsi všechny dnešní úkoly! Otevři truhlu v Úspěších."),400); }
  streakCheck(); badgeCheck(); savePet(); goalCheck();
}
function streakInfo(){
  const P=progInit(), t=pragueToday(); let n=0, d=t, start=t, guard=0;
  if(!P.days[t]) d=addDays(t,-1);
  while(guard++<400){ if(P.days[d]){ n++; start=d; d=addDays(d,-1); continue; } if(!isSchool(d)&&d<t){ d=addDays(d,-1); continue; } break; }
  return {n,start,today:!!P.days[t]};
}

const MONTH_NOM=["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
function schoolYearStart(){ const t=pragueToday(), y=+t.slice(0,4), mo=+t.slice(5,7); return mo>=9?y:y-1; }
function iso3(y,m,d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }
function hasPEOn(iso){ return lessonIds(iso).some(id=>{ const s=subj(id); return s&&s.pe; }); }
function monthHtml(y,m,print){
  const first=iso3(y,m,1), offset=(dow(first)+6)%7, dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(), today=pragueToday();
  let h='<div class="mo"><div class="mo-h">'+MONTH_NOM[m]+' <span>'+y+'</span></div><div class="mo-g">'+["Po","Út","St","Čt","Pá","So","Ne"].map(x=>'<span class="mo-w">'+x+'</span>').join("");
  for(let i=0;i<offset;i++) h+='<span></span>';
  for(let d=1;d<=dim;d++){
    const iso=iso3(y,m,d), w=dow(iso), we=w===0||w===6, hol=holidayOf(iso), tk=tasksFor(iso).length, ov=!hol&&!!overrideOf(iso), pe=!we&&!hol&&hasPEOn(iso);
    const title=[hol, tk?(tk===1?"1 úkol/akce":tk+" úkoly/akce"):"", ov?"změna rozvrhu":"", pe?"tělocvik":""].filter(Boolean).join(" · ");
    const cls="mo-d"+(we?" we":"")+(hol?" hol":"")+(iso===today?" today":"")+(!print&&iso===selected?" sel":"");
    const mk=(pe||tk||ov)?'<i class="mk">'+(pe?'<b class="pe"></b>':"")+(tk?'<b class="tk"></b>':"")+(ov?'<b class="ov"></b>':"")+'</i>':"";
    h+=print?'<span class="'+cls+'">'+d+mk+'</span>':'<button type="button" class="'+cls+'" data-yday="'+iso+'"'+(title?' title="'+esc(title)+'"':"")+' aria-label="'+d+'. '+(m+1)+'.'+(title?' – '+esc(title):"")+'">'+d+mk+'</button>';
  }
  return h+'</div></div>';
}
function yearHtml(print){ const y0=schoolYearStart(); let h='<div class="yr">'; for(let k=0;k<12;k++){ const m=(8+k)%12; h+=monthHtml(y0+(8+k>=12?1:0),m,print); } return h+'</div>'; }
function yearLegend(){ return '<div class="yl"><span><i class="lg hol"></i>volno a prázdniny</span><span><i class="lg we"></i>víkend</span><span><b class="pe"></b>tělocvik</span><span><b class="tk"></b>úkol nebo akce</span><span><b class="ov"></b>změna rozvrhu</span><span><i class="lg today"></i>dnes</span></div>'; }
function holidayStrip(){ const t=pragueToday(); return '<div class="hls">'+(cfg.holidays||[]).filter(h=>h.to>=t).map(h=>'<span><span class="mono">'+fmtShort(h.from)+(h.to!==h.from?'–'+fmtShort(h.to):"")+'</span>'+esc(h.name)+'</span>').join("")+'</div>'; }

/* ---------- kroužky a denní režim ---------- */
function activitiesFor(iso){ return (cfg.activities||[]).filter(a=>a.wd===dow(iso) && (!a.skipHolidays || isSchool(iso))); }
function routineFor(iso){ return (cfg.routine||[]).filter(r=>!r.school || isSchool(iso)); }
function hm2m(t){ const m=/^(\d{1,2}):(\d{2})$/.exec((t||"").trim()); return m?(+m[1])*60+(+m[2]):null; }
/* večerní časová osa dne: kroužky + režim; co se kryje s kroužkem, se posune před něj (movable) nebo vynechá */
function eveningFor(iso){
  const acts=activitiesFor(iso).map(a=>({kind:"act",a,start:hm2m(a.from),end:hm2m(a.to)})).filter(x=>x.start!=null&&x.end!=null);
  const out=[...acts];
  routineFor(iso).filter(r=>!r.school).forEach(r=>{
    let t=hm2m(r.time); if(t==null) return;
    const clash=acts.find(x=>t>=x.start&&t<x.end);
    if(clash){ if(!r.movable) return; t=clash.start-30; }
    out.push({kind:"rt",r,start:t,moved:!!clash});
  });
  return out.sort((a,b)=>a.start-b.start);
}

/* ---------- export do kalendáře (.ics) ---------- */
function icsEsc(x){ return String(x).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function icsFold(line){ const out=[]; let cur=""; for(const ch of line){ const b=new TextEncoder().encode(cur+ch).length; if(b>73){ out.push(cur); cur=" "+ch; } else cur+=ch; } out.push(cur); return out.join("\r\n"); }
function buildICS(fromIso){
  const t=fromIso||pragueToday(), y0=schoolYearStart(), end=(y0+1)+"-06-30";
  const ymd=d=>d.replace(/-/g,""), hm=x=>String(Math.floor(x/60)).padStart(2,"0")+String(x%60).padStart(2,"0")+"00";
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Skolni partak//CS","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Škola"+(cfg.child?" – "+cfg.child:""),"X-WR-TIMEZONE:Europe/Prague",
    "BEGIN:VTIMEZONE","TZID:Europe/Prague","BEGIN:DAYLIGHT","TZOFFSETFROM:+0100","TZOFFSETTO:+0200","TZNAME:CEST","DTSTART:19700329T020000","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU","END:DAYLIGHT",
    "BEGIN:STANDARD","TZOFFSETFROM:+0200","TZOFFSETTO:+0100","TZNAME:CET","DTSTART:19701025T030000","RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU","END:STANDARD","END:VTIMEZONE"];
  for(let d=t; d<=end; d=addDays(d,1)){
    const p=dayPlan(d);
    if(isSchool(d) && p.lessons.length){
      const tl=timeline(p);
      const desc=p.lessons.map((x,i)=>(i+1)+". "+(cfg.times[i]?cfg.times[i]+" ":"")+x.name).join("\n")+(p.hasPE?"\n\nTělocvik: úbor + boty":"")+
        "\n\nUčebnice: "+p.groups.filter(g=>g.items.length).map(g=>g.short).join(", ")+(p.ov&&p.ov.note?"\n\nZměna: "+p.ov.note:"");
      L.push("BEGIN:VEVENT","UID:skola-"+ymd(d)+"@skolni-partak","DTSTAMP:"+stamp,
        tl?"DTSTART;TZID=Europe/Prague:"+ymd(d)+"T"+hm(tl.start):"DTSTART;VALUE=DATE:"+ymd(d),
        tl?"DTEND;TZID=Europe/Prague:"+ymd(d)+"T"+hm(tl.end):"DTEND;VALUE=DATE:"+ymd(addDays(d,1)),
        "SUMMARY:"+icsEsc("Škola: "+p.lessons.map(x=>x.short).join(" · ")+(p.hasPE?" + TV":"")),"DESCRIPTION:"+icsEsc(desc),"END:VEVENT");
    }
    p.tasks.forEach(k=>L.push("BEGIN:VEVENT","UID:ukol-"+k.tid+"@skolni-partak","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(d),"DTEND;VALUE=DATE:"+ymd(addDays(d,1)),
      "SUMMARY:"+icsEsc((TASK_KIND[k.kind]||TASK_KIND.akce).label+": "+k.name),"TRANSP:TRANSPARENT","END:VEVENT"));
  }
  (cfg.holidays||[]).filter(h=>h.to>=t).forEach(h=>L.push("BEGIN:VEVENT","UID:volno-"+ymd(h.from)+"@skolni-partak","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(h.from),
    "DTEND;VALUE=DATE:"+ymd(addDays(h.to,1)),"SUMMARY:"+icsEsc(h.name),"TRANSP:TRANSPARENT","END:VEVENT"));
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n")+"\r\n";
}
function downloadICS(){
  try{
    const blob=new Blob([buildICS()],{type:"text/calendar;charset=utf-8"}), a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="skola"+(cfg.child?"-"+cfg.child.toLowerCase():"")+".ics"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast("Soubor kalendáře připraven.");
  }catch(e){ toast("Soubor se nepodařilo vytvořit."); }
}

/* ---------- průvodce balením batohu ---------- */
function packSteps(iso){
  const p=dayPlan(iso), st=[];
  if(p.tasks.length) st.push({t:"Úkoly a věci navíc",ic:"i-flag",items:p.tasks});
  p.groups.forEach(g=>{ if(g.items.length) st.push({t:g.title,tag:g,items:g.items}); });
  if(p.hasPE&&p.pe.length) st.push({t:"Tělocvik",ic:"i-shirt",items:p.pe});
  if(p.pencil.length) st.push({t:"Penál",ic:"i-pencil",items:p.pencil});
  if(p.daily.length) st.push({t:"Každý den",ic:"i-bag",items:p.daily});
  (p.acts||[]).filter(a=>a.items.length).forEach(a=>st.push({t:actLabel(a),ic:a.shared?"i-flag":"i-pulse",items:a.items}));
  return st;
}
function openPack(iso){
  const steps=packSteps(iso); if(!steps.length){ toast("Na tento den není co balit."); return; }
  let k=steps.findIndex(s=>s.items.some(it=>!isChecked(iso,it.id))); if(k<0) k=steps.length;
  const ov=document.createElement("div"); ov.className="overlay pack-ov"; ov.id="packwiz";
  const draw=()=>{
    const tot=steps.reduce((n,s)=>n+s.items.length,0), done=steps.reduce((n,s)=>n+s.items.filter(it=>isChecked(iso,it.id)).length,0);
    const bar='<div class="pk-bar"><i style="width:'+Math.round(100*done/Math.max(1,tot))+'%"></i></div><div class="pk-steps">'+steps.map((s,i)=>'<span class="'+(i<k?"ok":i===k?"cur":"")+'"></span>').join("")+'</div>';
    if(k>=steps.length){
      const first=PET.name&&!(PET.packDay||{})[iso];
      if(first){ PET.packDay=PET.packDay||{}; PET.packDay[iso]=true; Object.keys(PET.packDay).filter(d=>d<addDays(pragueToday(),-30)).forEach(d=>delete PET.packDay[d]); earnCoins(10); PET.inv.carrot=(PET.inv.carrot||0)+1; savePet(); prog("pack"); }
      ov.innerHTML='<div class="sheet pack done">'+bar+'<div class="pk-win"><div class="pk-confetti">'+[...Array(18)].map((_,i)=>'<i style="left:'+(i*5.5)+'%;animation-delay:'+(i%6)*.12+'s;background:'+["#FFE14D","#FF4F8B","#40C4FF","#7CFF9B"][i%4]+'"></i>').join("")+'</div>'+
        '<h2>Batoh je sbalený!</h2><p>Na '+DAY_ACC[dow(iso)]+' '+fmtShort(iso)+' máš všechno.</p>'+(first?'<p class="pk-rew">'+esc(PET.name)+' dostal <b>10 mincí</b> a <b>mrkev</b>.</p>':PET.name?'<p class="pk-rew">Odměnu za tento den už '+esc(PET.name)+' dostal.</p>':"")+
        '<button type="button" class="btn primary big" data-pkclose>Hotovo</button></div></div>'; return;
    }
    const s=steps[k], all=s.items.every(it=>isChecked(iso,it.id));
    ov.innerHTML='<div class="sheet pack">'+bar+'<span class="eyebrow">Krok '+(k+1)+' z '+steps.length+' · '+DAY_ACC[dow(iso)]+' '+fmtShort(iso)+'</span>'+
      '<h2 class="pk-h">'+(s.tag?stag(s.tag):ic(s.ic))+'<span>'+esc(s.t)+'</span></h2><p class="pk-sub">Dej do batohu a klepni na každou věc:</p>'+
      '<div class="pk-items">'+s.items.map(it=>'<button type="button" class="pk-it'+(isChecked(iso,it.id)?" on":"")+'" data-pkit="'+esc(it.id)+'"><span class="pk-box">'+ic("i-check")+'</span>'+esc(it.name)+'</button>').join("")+'</div>'+
      '<div class="pk-foot"><button type="button" class="btn" data-pkback'+(k===0?" disabled":"")+'>Zpět</button><button type="button" class="btn" data-pkclose>Později</button>'+
      '<button type="button" class="btn primary big" data-pknext>'+(all?"Další":"Mám všechno")+' →</button></div></div>';
  };
  ov.addEventListener("click",e=>{ e.stopPropagation();
    const it=e.target.closest("[data-pkit]"); if(it){ toggle(iso,it.dataset.pkit); draw(); return; }
    if(e.target.closest("[data-pknext]")){ steps[k].items.forEach(x=>{ if(!isChecked(iso,x.id)) toggle(iso,x.id); }); k++; draw(); return; }
    if(e.target.closest("[data-pkback]")){ k=Math.max(0,k-1); draw(); return; }
    if(e.target.closest("[data-pkclose]")){ ov.remove(); render(); return; }
  });
  document.body.appendChild(ov); draw();
}

    '<div class="sheet-foot"><div><div class="eyebrow" style="margin-bottom:.35rem">Zkontrolovat jiný den</div><div class="otherdays">'+others+'</div></div>'+

/* ---------- vykreslení ---------- */
let rendering=false;
function render(){
  const ae=document.activeElement;
  if(ae && ae!==document.body && $app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) ae.blur();
  if(rendering) return;
  rendering=true;
  try{ renderNow(); } finally{ rendering=false; }
}
function renderNow(){
  const pos={};
  if(!resetScroll) document.querySelectorAll("[data-scroll]").forEach(el=>{ pos[el.dataset.scroll]=el.scrollTop; });
  resetScroll=false;
  const p=dayPlan(selected);
  let cls="main", main;
  if(view==="home") main=homeCards(p)+bottomRow(p);
  else if(view==="settings"){ cls+=" settings"; main=settingsHtml(); }
  else if(view==="print"){ cls+=" settings"; main=printView(); }
  else if(view==="learn"){ cls+=" settings"; main=learnHtml(); }
  else if(view==="pet"){ cls+=" settings"; main=petHtml(); }
  else { cls+=" single"; main=detailHtml(view,p)+bottomRow(p); }
  $app.innerHTML='<div class="app">'+headHtml(p)+sideHtml()+'<main class="'+cls+'">'+main+'</main>'+tabsHtml()+'</div>';
  if(view==="print"){ fitPreview(); requestAnimationFrame(fitPreview); }
  document.querySelectorAll("[data-scroll]").forEach(el=>{ if(pos[el.dataset.scroll]) el.scrollTop=pos[el.dataset.scroll]; });
  renderModal();
  tickClocks();
  hydratePhotos();
  autoSay();
}
function autoSay(){ try{ if(view!=="learn"||!quiz||quiz.done||quiz.picked!=null||!quiz.refs||!quiz.refs[quiz.i]) return; if(quiz.saidI===quiz.i) return; const [a,qi]=quiz.refs[quiz.i], q=lessonById(a).quiz[qi]; if(!q||!q.say) return; quiz.saidI=quiz.i; setTimeout(()=>speak(q.say,q.sayLang),250); }catch(e){} }

document.addEventListener("submit", e=>{
  e.preventDefault();
  const f=e.target, inp=f.querySelector("input[type=text]"), val=inp?inp.value.trim():"";

    const from=document.getElementById("add-hol-from").value, to=document.getElementById("add-hol-to").value||from;
    if(!from){ toast("Vyber datum."); return; }
    cfg.holidays.push({id:uid(), from, to:to<from?from:to, name:val||"Volno"}); sortHolidays(); saveCfg(); resetSelected(); render(); toast("Volno přidáno."); return;
  }
  if(!val) return;
  if(f.dataset.additem!==undefined) cfg.subjects[+f.dataset.additem].items.push({id:uid(),name:val});
  else if(f.dataset.addlist) cfg[f.dataset.addlist].push(Object.assign({id:uid(),name:val}, f.dataset.addlist==="daily"?{kind:"other"}:{}));
  else if(f.id==="add-subj") cfg.subjects.push({id:uid(),name:val,short:val.slice(0,3).toUpperCase(),color:"blue",icon:"book",pe:false,unverified:false,askParent:false,items:[]});
  else if(f.id==="add-time") cfg.times.push(val);
  saveCfg(); render(); toast("Přidáno.");
  const again=document.getElementById(inp.id); if(again) again.focus();
});

    var badges=BADGES.filter(function(b){ return P.badges&&P.badges[b.id]; });
    var TIERS=[["Běžná","#C9D1DC","#7D8796","#F4F6F9"],["Vzácná","#7CC4FF","#2F6FE0","#EEF6FF"],["Epická","#C59BFF","#6A3FD1","#F5EEFF"],["Legendární","#FFE07A","#E39A00","#FFF8E1"]];
    var ti=lvl<=2?0:lvl<=4?1:lvl<=6?2:3, T=TIERS[ti];
    function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
    function txt(t,x,y,size,weight,color,align){ g.font=(weight||"700")+" "+size+"px "+F; g.fillStyle=color||"#2D1B3D"; g.textAlign=align||"left"; g.fillText(t,x,y); }
    function fit(t,max,size,weight){ g.font=(weight||"700")+" "+size+"px "+F; while(g.measureText(t).width>max&&t.length>3) t=t.slice(0,-2)+"…"; return t; }
    function star(cx,cy,r,col){ g.save(); g.translate(cx,cy); g.beginPath(); for(var i=0;i<8;i++){ var a=i*Math.PI/4, rad=i%2?r*.28:r; g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); } g.closePath(); g.fillStyle=col; g.fill(); g.restore(); }
    // rám karty + holografický lesk
    g.save(); rr(0,0,W,H,60); g.clip();
    var fr=g.createLinearGradient(0,0,W,H); fr.addColorStop(0,T[1]); fr.addColorStop(.5,T[2]); fr.addColorStop(1,T[1]); g.fillStyle=fr; g.fillRect(0,0,W,H);
    var holo=["#FF8AD8","#FFE47A","#7CF5C4","#7CC4FF","#C59BFF"];
    g.globalAlpha=ti===0?.12:.28; for(var k=-H;k<W+H;k+=70){ g.fillStyle=holo[(k/70+40)%5|0]; g.beginPath(); g.moveTo(k,0); g.lineTo(k+34,0); g.lineTo(k+34-H*.6,H); g.lineTo(k-H*.6,H); g.closePath(); g.fill(); }
    g.globalAlpha=1;
    // vnitřní plocha
    var ip=g.createLinearGradient(0,40,0,H-40); ip.addColorStop(0,"#FFFFFF"); ip.addColorStop(1,T[3]); g.fillStyle=ip; rr(34,34,W-68,H-68,40); g.fill();
    g.lineWidth=4; g.strokeStyle="rgba(255,255,255,.9)"; rr(34,34,W-68,H-68,40); g.stroke();
    // hlavička: jméno + úroveň
    txt(fit(PET.name||"Morče",700,76,"800"),76,138,76,"800");
    txt(stg.name+" · "+(PET.xp||0)+" XP",78,186,34,"600","#6B5A80");
    g.fillStyle=T[2]; g.beginPath(); g.arc(W-138,114,66,0,7); g.fill(); g.lineWidth=6; g.strokeStyle="#fff"; g.stroke();
    txt("ÚROVEŇ",W-138,92,20,"800","#fff","center"); txt(String(lvl),W-138,150,60,"900","#fff","center");
    // obrázek
    var px=72,py=214,pw=936,ph=669;
    g.fillStyle=T[2]; rr(px-10,py-10,pw+20,ph+20,30); g.fill();
    var svg=petScene().replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="900" ');
    var img=new Image();
    img.onload=function(){
      g.save(); rr(px,py,pw,ph,22); g.clip(); g.drawImage(img,px,py,pw,ph);
      // lesk přes obrázek
      var sh=g.createLinearGradient(px,py,px+pw,py+ph); sh.addColorStop(0,"rgba(255,255,255,0)"); sh.addColorStop(.45,"rgba(255,255,255,0)"); sh.addColorStop(.5,"rgba(255,255,255,.28)"); sh.addColorStop(.55,"rgba(255,255,255,0)"); g.fillStyle=sh; g.fillRect(px,py,pw,ph);
      g.restore();
      if(ti>0){ star(px+pw-40,py+44,26,"#fff"); star(px+pw-84,py+84,14,"rgba(255,255,255,.85)"); }
      // typový proužek
      var born=PET.born?new Date(PET.born):null, bs=born?born.getDate()+". "+(born.getMonth()+1)+". "+born.getFullYear():"";
      g.fillStyle="rgba(45,27,61,.06)"; rr(72,910,936,66,33); g.fill();
      txt("🐹  Morče"+(bs?" · narozen "+bs:""),100,955,30,"700","#4A3A60");
      txt("⭐ "+(PET.gold||0)+"  ·  🪙 "+(PET.coins||0),W-100,955,30,"700","#4A3A60","right");
      // statistiky jako na sportovní kartě
      var st=[["🔥",String(s.n),"dní v řadě"],["🏅",badges.length+"/"+BADGES.length,"odznaků"],["✅",String(cnt.answers||0),"správně"],["👕",String((PET.owned||[]).length),"věcí v šatníku"]];
      var bw=(936-3*18)/4;
      st.forEach(function(x,i){ var bx=72+i*(bw+18), by=1000; g.fillStyle="#fff"; rr(bx,by,bw,176,24); g.fill(); g.lineWidth=3; g.strokeStyle=T[1]; rr(bx,by,bw,176,24); g.stroke();
        txt(x[0],bx+bw/2,by+58,44,"400","#000","center"); txt(fit(x[1],bw-20,50,"900"),bx+bw/2,by+118,50,"900",T[2],"center"); txt(fit(x[2],bw-16,21,"700"),bx+bw/2,by+154,21,"700","#7A6A8E","center"); });
      // schopnosti
      var em=EMOTES.filter(function(e){ return lvl>=e.lv; }).map(function(e){ return e.name; });
      function row(y,ic,label,val){ g.fillStyle="rgba(45,27,61,.05)"; rr(72,y,936,82,22); g.fill(); txt(ic,100,y+56,40,"400"); txt(label,160,y+54,32,"800","#2D1B3D"); txt(fit(val,560,28,"600"),W-100,y+54,28,"600","#5A4A70","right"); }
      row(1198,"💃","Tanečky",em.length?em.join(", "):"zatím se učí");
      row(1292,"🎓","Testy",(cnt.tests||0)+" hotových · "+(cnt.daily||0)+"× Test dne");
      // patička: vzácnost, odznaky, číslo karty
      var gems=""; for(var j=0;j<=ti;j++) gems+="◆"; txt(gems,78,1428,34,"900",T[2]); g.font="900 34px "+F; var gwd=g.measureText(gems).width;
      txt(T[0],86+gwd,1428,30,"800",T[2]);
      txt("č. "+String(lvl).padStart(3,"0")+" / "+String(PET_STAGES.length).padStart(3,"0"),W-78,1428,28,"800","#7A6A8E","right");
      if(badges.length){ g.font="34px "+F; g.textAlign="center"; var bstep=Math.min(46,330/badges.length), bx0=W/2-bstep*(badges.length-1)/2; badges.forEach(function(b,i){ g.fillText(b.e,bx0+i*bstep,1430); }); }
      txt("Školní parťák · sběratelská karta · "+(function(d){return d.getDate()+". "+(d.getMonth()+1)+". "+d.getFullYear();})(new Date()),W/2,1468,20,"700","#A090B4","center");
      g.restore();
      c.toBlob(function(b){ b?resolve(b):reject(new Error("blob")); },"image/png");
    };
    img.onerror=function(){ reject(new Error("svg")); };
    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
}
function openShare(){
  var ov=document.createElement("div"); ov.className="overlay share-ov";
  ov.innerHTML='<div class="sheet"><h2>Tvoje sběratelská karta</h2><p>Chystám obrázek…</p></div>';
  document.body.appendChild(ov);
  ov.addEventListener("click",function(e){ e.stopPropagation(); if(e.target===ov||e.target.closest("[data-shclose]")) ov.remove(); });
  shareCardBlob().then(function(blob){
    var url=URL.createObjectURL(blob), name="karta-"+(PET.name||"").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"")+".png";
    var file=null; try{ file=new File([blob],name,{type:"image/png"}); }catch(e){}
    var canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
    var text="Podívej se na moje morče "+PET.name+"! Je na úrovni "+petLevel()+" a mám sérii "+streakInfo().n+" dní v řadě 🔥";
    ov.querySelector(".sheet").innerHTML='<h2>Tvoje sběratelská karta</h2><div class="cardwrap"><img alt="Sběratelská karta morčete" src="'+url+'"></div>'+
      '<div class="row">'+(canShare?'<button type="button" class="btn primary big" data-shgo>📤 Poslat</button>':'<a class="btn primary big" download="'+name+'" href="'+url+'">⬇️ Uložit obrázek</a>')+'<button type="button" class="btn big" data-shclose>Zavřít</button></div>'+
      '<p class="hint">Na kartě je jen morče a tvoje úspěchy. Čím vyšší úroveň, tím vzácnější karta. '+(canShare?'Vyber, komu ho pošleš.':'Můžeš taky podržet prst na obrázku a vybrat Uložit nebo Sdílet.')+'</p>';
    var go=ov.querySelector("[data-shgo]");
    if(go) go.addEventListener("click",function(e){ e.stopPropagation(); navigator.share({files:[file],title:"Moje morče "+PET.name,text:text}).catch(function(){}); });
  }).catch(function(){ ov.querySelector(".sheet").innerHTML='<h2>Obrázek se nepovedl</h2><p>Zkus to prosím znovu.</p><div class="row"><button type="button" class="btn" data-shclose>Zavřít</button></div>'; });
}
document.addEventListener("click",function(e){ var b=e.target.closest("[data-pshare]"); if(b){ e.preventDefault(); e.stopPropagation(); openShare(); } },true);

})();
</script>


<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http")===0) {
  var hadSW=!!navigator.serviceWorker.controller, reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){ if(hadSW && !reloading){ reloading=true; location.reload(); } });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("service-worker.js",{updateViaCache:"none"}).then(function(reg){
      function check(){
        reg.update().catch(function(){});
        fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(v){
          if(v && v.version && window.APP_VERSION && String(v.version)!==String(window.APP_VERSION) && !reloading){
            var key="skolni-partak.reloadfor", done=null; try{ done=sessionStorage.getItem(key); }catch(e){}
            if(done===String(v.version)) return;
            try{ sessionStorage.setItem(key,String(v.version)); }catch(e){}
            reloading=true; location.reload(); }
        }).catch(function(){});
      }
      check();
      document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") check(); });
      setInterval(check, 30*60*1000);
    }).catch(function(){});
  });
}
</script>
<style>
/* nápovědy (hover na počítači, klepnutí / podržení na iPadu) */
[data-tip]:not(button):not(a){cursor:help}
button[data-tip]{-webkit-touch-callout:none}
.tipbox{position:fixed;z-index:9999;max-width:min(320px,calc(100vw - 24px));padding:.6rem .8rem;border-radius:.8rem;background:#1E2235;color:#fff;font:500 .92rem/1.4 inherit;font-family:inherit;white-space:pre-line;box-shadow:0 10px 30px rgba(20,24,50,.28);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s}
.tipbox.on{opacity:1;transform:none}
.tipbox::after{content:"";position:absolute;left:var(--ax,50%);width:12px;height:12px;background:#1E2235;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tipbox.up::after{bottom:-5px}
.tipbox.down::after{top:-5px}
/* sdílení */

@keyframes cardShine{0%{background-position:120% 0}60%,100%{background-position:-60% 0}}

<script>
/* ===== Nápovědy ===== */
(function(){
  var box=null, cur=null, hideT=null, pressT=null, pressEl=null, suppressClick=false, touchMode=false;
  function tipOf(el){
    var t=el.closest("[data-tip],[title]");
    if(!t) return null;
    if(!t.hasAttribute("data-tip")){ var tt=t.getAttribute("title"); if(!tt) return null; t.setAttribute("data-tip",tt); t.removeAttribute("title"); }
    return t.getAttribute("data-tip")?t:null;
  }
  function show(el){
    var text=el.getAttribute("data-tip"); if(!text) return;
    if(!box){ box=document.createElement("div"); box.className="tipbox"; box.setAttribute("role","tooltip"); document.body.appendChild(box); }
    cur=el; box.textContent=text; box.className="tipbox"; box.style.left="0px"; box.style.top="0px";
    var r=el.getBoundingClientRect(), b=box.getBoundingClientRect(), vw=window.innerWidth, vh=window.innerHeight;
    var cx=r.left+r.width/2, left=Math.max(12,Math.min(vw-b.width-12,cx-b.width/2));
    var up=r.top>b.height+18, top=up?r.top-b.height-10:Math.min(vh-b.height-8,r.bottom+10);
    box.style.left=left+"px"; box.style.top=top+"px"; box.style.setProperty("--ax",Math.max(14,Math.min(b.width-14,cx-left))+"px");
    box.className="tipbox "+(up?"up":"down"); void box.offsetWidth; box.classList.add("on");
    clearTimeout(hideT); if(touchMode) hideT=setTimeout(hide,7000);
  }
  function hide(){ cur=null; clearTimeout(hideT); if(box) box.classList.remove("on"); }
  window.hideTip=hide;
  // myš
  var hoverT=null;
  document.addEventListener("mouseover",function(e){ if(touchMode) return; var t=tipOf(e.target); if(t===cur) return; clearTimeout(hoverT); if(!t){ hide(); return; } hoverT=setTimeout(function(){ show(t); },250); });
  document.addEventListener("mouseout",function(e){ if(touchMode) return; var t=tipOf(e.target); if(t&&e.relatedTarget&&t.contains(e.relatedTarget)) return; clearTimeout(hoverT); hide(); });
  // dotyk: tlačítka = podržet prst, ostatní = klepnout
  function isAction(el){ return !!el.closest("button,a,input,select,label,[data-view],[data-day]"); }
  document.addEventListener("touchstart",function(e){
    touchMode=true; var t=tipOf(e.target); clearTimeout(pressT); pressEl=null;
    if(!t){ hide(); return; }
    if(isAction(t)||isAction(e.target)){ pressEl=t; pressT=setTimeout(function(){ suppressClick=true; show(t); if(navigator.vibrate) try{navigator.vibrate(10);}catch(_){} },450); }
  },{passive:true});
  document.addEventListener("touchmove",function(){ clearTimeout(pressT); },{passive:true});
  document.addEventListener("touchend",function(){ clearTimeout(pressT); },{passive:true});
  document.addEventListener("click",function(e){
    if(suppressClick){ suppressClick=false; e.preventDefault(); e.stopPropagation(); return; }
    if(!touchMode) return;
    var t=tipOf(e.target);
    if(t&&!isAction(e.target)&&!isAction(t)){ if(cur===t) hide(); else show(t); }
    else if(!t) hide();
  },true);
  document.addEventListener("contextmenu",function(e){ if(pressEl&&e.target.closest("[data-tip]")) e.preventDefault(); });
  window.addEventListener("scroll",hide,true); window.addEventListener("resize",hide);
})();

</script>
